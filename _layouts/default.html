---
layout: compress
---
<!DOCTYPE html>
<html lang="{{ page.lang | default: 'en' }}">
  {% include head.html %}
  <body>
    {% include sidebar.html %}

    <main id="main" class="open">
      {{ content }}

      {% include footer.html %}
    </main>

    <button id="menu" class="open" aria-label="Toggle blog navigation" aria-controls="sidebar" aria-expanded="true">
      <span id="menu-icons"></span>
    </button>

    <button id="post-toc-menu" aria-label="Toggle table of contents" aria-controls="post-toc" aria-expanded="false">
      <span id="post-toc-menu-icons"></span>
    </button>
    <div id="post-toc">
      <span id="post-toc-title">Table of Contents</span>
      <ul id="post-toc-ul"></ul>
    </div>

    {% include scripts.html %}
  </body>
</html>
